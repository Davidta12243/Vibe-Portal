<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Stand Neck -->
  <path d="M 27 43 L 25 53 L 39 53 L 37 43 Z" fill="#64748b"/>
  <!-- Stand Base -->
  <rect x="18" y="52" width="28" height="4" rx="2" fill="#94a3b8"/>
  
  <!-- Monitor Outer Frame -->
  <rect x="5" y="6" width="54" height="38" rx="5" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Screen Display -->
  <rect x="8" y="9" width="48" height="28" rx="2.5" fill="url(#screenGrad)"/>
  
  <!-- Window/Terminal UI on Screen -->
  <rect x="12" y="14" width="14" height="2.5" rx="1.2" fill="#ffffff" opacity="0.9"/>
  <rect x="12" y="19" width="20" height="2.5" rx="1.2" fill="#ffffff" opacity="0.75"/>
  <rect x="12" y="24" width="10" height="2.5" rx="1.2" fill="#ffffff" opacity="0.75"/>
  
  <!-- Mini CPU / Chip Badge on Right -->
  <rect x="38" y="14" width="13" height="13" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="42" y="18" width="5" height="5" rx="1" fill="#38bdf8"/>
  
  <!-- Power LED -->
  <circle cx="32" cy="40.5" r="1.2" fill="#4ade80"/>
</svg>
